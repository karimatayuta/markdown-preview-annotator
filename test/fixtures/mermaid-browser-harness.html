<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beautiful Mermaid browser verification</title>
  <link rel="stylesheet" href="/media/styles.css">
  <style>
    :root {
      --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --vscode-editor-font-family: "SFMono-Regular", Consolas, monospace;
      --vscode-editor-background: #18181b;
      --vscode-editor-foreground: #e4e4e7;
      --vscode-editorWidget-background: #27272a;
      --vscode-descriptionForeground: #a1a1aa;
      --vscode-textLink-foreground: #60a5fa;
      --vscode-panel-border: #3f3f46;
      --vscode-errorForeground: #f87171;
      --vscode-button-background: #2563eb;
      --vscode-button-foreground: #ffffff;
      --vscode-button-hoverBackground: #1d4ed8;
      --vscode-input-background: #27272a;
      --vscode-input-foreground: #e4e4e7;
      --vscode-input-border: #52525b;
      --vscode-focusBorder: #60a5fa;
      --vscode-editor-selectionBackground: #264f78;
      --vscode-textBlockQuote-background: #27272a;
      --vscode-textBlockQuote-border: #52525b;
    }

    body {
      min-width: 0;
      background: var(--vscode-editor-background);
    }

    .verification-shell {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 32px 0 64px;
    }

    .verification-heading {
      margin-bottom: 24px;
    }

    .verification-heading p {
      color: var(--vscode-descriptionForeground);
    }

    .verification-badge {
      display: inline-flex;
      margin-bottom: 10px;
      padding: 5px 10px;
      border: 1px solid #14532d;
      border-radius: 999px;
      color: #86efac;
      background: #052e16;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .hidden,
    .annotation-pane,
    .toolbar {
      display: none !important;
    }
  </style>
</head>
<body class="vscode-dark width-full">
  <main class="verification-shell">
    <header class="verification-heading">
      <span class="verification-badge">BROWSER RUNTIME VERIFICATION</span>
      <h1>Craft Beautiful Mermaid rendering</h1>
      <p>Craftの公開サンプルと同じ記法を、配布用Webviewバンドルで描画しています。</p>
    </header>

    <section class="preview-pane">
      <article id="preview" class="markdown-body">
        <h2>CI/CD Pipeline</h2>
        <figure class="mermaid-figure">
          <pre class="mermaid-source">graph TD
  subgraph ci [CI Pipeline]
    A[Push Code] --&gt; B{Tests Pass?}
    B --&gt;|Yes| C[Build Image]
    B --&gt;|No| D[Fix &amp; Retry]
    D -.-&gt; A
  end
  C --&gt; E([Deploy Staging])
  E --&gt; F{QA Approved?}
  F --&gt;|Yes| G((Production))
  F --&gt;|No| D</pre>
        </figure>

        <h2>OAuth 2.0 Sequence</h2>
        <figure class="mermaid-figure">
          <pre class="mermaid-source">sequenceDiagram
  actor U as User
  participant App as Client App
  participant Auth as Auth Server
  participant API as Resource API
  U-&gt;&gt;App: Click Login
  App-&gt;&gt;Auth: Authorization request
  Auth-&gt;&gt;U: Login page
  U-&gt;&gt;Auth: Credentials
  Auth--&gt;&gt;App: Authorization code
  App-&gt;&gt;Auth: Exchange code for token
  Auth--&gt;&gt;App: Access token
  App-&gt;&gt;API: Request + token
  API--&gt;&gt;App: Protected resource
  App--&gt;&gt;U: Display data</pre>
        </figure>

        <h2>Sprint Burndown</h2>
        <figure class="mermaid-figure">
          <pre class="mermaid-source">xychart-beta
    title "Sprint Burndown"
    x-axis [D1, D2, D3, D4, D5, D6, D7, D8, D9, D10]
    y-axis "Story Points" 0 --&gt; 80
    line [72, 65, 58, 50, 45, 38, 30, 22, 12, 0]
    line [72, 65, 58, 50, 43, 36, 29, 22, 14, 0]</pre>
        </figure>
      </article>
    </section>
  </main>

  <button id="display-toggle" class="hidden"></button>
  <div id="display-settings" class="hidden"></div>
  <button id="font-decrease" class="hidden"></button>
  <span id="font-size-value" class="hidden"></span>
  <button id="font-increase" class="hidden"></button>
  <select id="font-family-select" class="hidden"><option value="theme">theme</option></select>
  <select id="line-height-select" class="hidden"><option value="normal">normal</option></select>
  <select id="content-width-select" class="hidden"><option value="full">full</option></select>
  <button id="clear-all" class="hidden"></button>
  <button id="copy-all" class="hidden"></button>
  <span id="annotation-count" class="hidden"></span>
  <p id="empty-state" class="hidden"></p>
  <ol id="annotation-list" class="hidden"></ol>
  <button id="selection-bubble" class="hidden"></button>
  <form id="composer" class="hidden">
    <blockquote id="composer-quote"></blockquote>
    <textarea id="comment-input"></textarea>
    <button id="cancel-comment" type="button"></button>
  </form>
  <div id="toast" class="hidden"></div>
  <script id="boot-data" type="application/json">{"filePath":"craft-samples.md","initialAnnotations":[],"prefs":{"fontSize":14,"fontFamily":"theme","lineHeight":"normal","contentWidth":"full"}}</script>
  <script>
    window.acquireVsCodeApi = () => ({
      getState: () => undefined,
      setState: () => {},
      postMessage: () => {},
    });
  </script>
  <script src="/media/main.js"></script>
</body>
</html>
